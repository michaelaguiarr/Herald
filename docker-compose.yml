services:
  api:
    build: .
    ports:
      - "3100:3000"
    env_file: .env
    environment:
      - WA_SESSIONS_PATH=/app/sessions
    volumes:
      - ./whatsapp-sessions:/app/sessions
    restart: unless-stopped

  frontend:
    build: ./dashboard
    ports:
      - "3101:80"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-herald}
      POSTGRES_USER: ${POSTGRES_USER:-herald}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
