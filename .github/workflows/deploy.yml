name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            cd /opt/docker/herald
            git pull
            docker compose up --build -d
            # REDUNDANTE POR DESIGN — não reordene achando que é bug.
            #
            # Quem de fato aplica as migrations é o scripts/entrypoint.sh do
            # container, que roda `prisma migrate deploy` ANTES de dar exec no
            # servidor. Quando esta linha executa, a migration já passou.
            #
            # Mover este comando para ANTES do `up --build -d` PIORA: o `exec`
            # entra no container que está no ar, ou seja, na imagem ANTIGA —
            # cujo /app/prisma/migrations ainda não tem a migration nova. Não
            # aplicaria nada, e ainda abortaria o deploy se o container
            # estivesse parado.
            #
            # O valor desta linha é ser uma segunda passada idempotente: se a
            # migration falhar no entrypoint, o container morre em restart-loop
            # e este comando falha junto, fazendo o erro aparecer no CI em vez
            # de só no log do container.
            docker compose exec api npx prisma migrate deploy

      - name: Health check
        run: |
          echo "Aguardando 30s para a aplicação subir..."
          sleep 30

          HEALTH_URL="https://app.michaelsolutions.com.br/api/health"
          MAX_RETRIES=3
          ATTEMPT=0

          until [ $ATTEMPT -ge $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Tentativa $ATTEMPT/$MAX_RETRIES — $HEALTH_URL"

            HTTP_CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 10 "$HEALTH_URL")
            STATUS_VALUE=$(jq -r '.status' /tmp/health.json 2>/dev/null)

            echo "HTTP $HTTP_CODE | status: $STATUS_VALUE"

            if [ "$HTTP_CODE" = "200" ] && [ "$STATUS_VALUE" = "ok" ]; then
              echo "Health check passou."
              exit 0
            fi

            if [ $ATTEMPT -lt $MAX_RETRIES ]; then
              echo "Aguardando 10s antes da próxima tentativa..."
              sleep 10
            fi
          done

          echo "Health check falhou após $MAX_RETRIES tentativas."
          exit 1

      - name: Notify Telegram — success
        if: success()
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Herald — deploy concluído
            Branch: main
            Commit: ${{ env.SHORT_SHA }}
            Por: ${{ github.event.head_commit.author.name }}

      - name: Notify Telegram — failure
        if: failure()
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Herald — deploy falhou
            Branch: main
            Commit: ${{ env.SHORT_SHA }}
            Por: ${{ github.event.head_commit.author.name }}