server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 is Docker's internal DNS resolver.
    # Using a variable in proxy_pass defers DNS lookup to request time,
    # so nginx starts correctly even when the api service is not yet up.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /v1/ {
        set $upstream http://api:3000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required for SSE (QR code streaming): disable buffering so
        # events are forwarded to the client immediately.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location /docs {
        set $upstream http://api:3000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }

    # SPA fallback — React Router handles client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
